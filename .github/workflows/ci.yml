name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import Apple signing certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode > /tmp/apple-cert.p12
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security import /tmp/apple-cert.p12 -k "$RUNNER_TEMP/build.keychain-db" -f pkcs12 -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db" ~/Library/Keychains/login.keychain-db
      - name: Create Apple notarization profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        run: |
          if [ -n "$APPLE_KEYCHAIN_PROFILE" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            xcrun notarytool store-credentials "$APPLE_KEYCHAIN_PROFILE" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --keychain "$RUNNER_TEMP/build.keychain-db"
          fi
      - run: npm ci
      - run: npm run build
      - run: npm --workspace @quietclaw/desktop run make
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ (secrets.APPLE_KEYCHAIN_PROFILE == '' || secrets.APPLE_APP_SPECIFIC_PASSWORD == '') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ (secrets.APPLE_KEYCHAIN_PROFILE == '' || secrets.APPLE_APP_SPECIFIC_PASSWORD == '') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_KEYCHAIN_PROFILE || '' }}
          APPLE_KEYCHAIN_PATH: ${{ secrets.APPLE_KEYCHAIN_PROFILE != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && format('{0}/build.keychain-db', runner.temp) || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm --workspace @quietclaw/desktop run make
